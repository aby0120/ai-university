name: Check textbook
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- book/Calculus-I.md book/Calculus-II.md
      - uses: actions/upload-artifact@v4
        with:
          name: ai-university-static-website
          path: dist
